version: '3.8'

services:
  # PlaySphere Backend & Frontend Service
  playsphere-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: playsphere_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/playsphere
      - JWT_SECRET=playsphere_production_super_secret_jwt_key_2026
      - JWT_REFRESH_SECRET=playsphere_production_super_secret_refresh_jwt_key_2026
      - FRONTEND_URL=http://localhost:5000
      - UPI_ADMIN_ID=lokesh2006svg@okhdfcbank
    depends_on:
      - mongodb
    networks:
      - playsphere-network

  # MongoDB Database Service with Persistent Volume
  mongodb:
    image: mongo:7.0
    container_name: playsphere_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - playsphere-network

volumes:
  mongodb_data:
    driver: local

networks:
  playsphere-network:
    driver: bridge
